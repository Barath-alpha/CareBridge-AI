<script>
document.addEventListener('DOMContentLoaded', () => {
    const logoutBtn = document.getElementById('nav-logout');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });
    }
    
    // Auth Guard: redirect unauthenticated users to login page
    const token = localStorage.getItem('access_token');
    const isAuthPath = window.location.pathname.includes('/login') || window.location.pathname.includes('/signup');
    if (!token && !isAuthPath && window.location.pathname !== '/') {
        window.location.href = '/login';
    }

    // Role-based navigation visibility
    try {
        const userObj = JSON.parse(localStorage.getItem('user') || '{}');
        const role = userObj.role || 'patient';
        
        const demoSelect = document.getElementById('demoRoleSelect');
        if (demoSelect) {
            demoSelect.value = role;
        }

        if (['doctor', 'care_coordinator', 'admin'].includes(role)) {
            const clinicianSection = document.getElementById('section-clinician');
            if (clinicianSection) {
                clinicianSection.style.display = 'block';
            }
        }
    } catch(e) {
        console.error("Error reading user role from localStorage:", e);
    }
});

window.switchDemoRole = (newRole) => {
    try {
        const userObj = JSON.parse(localStorage.getItem('user') || '{}');
        userObj.role = newRole;
        localStorage.setItem('user', JSON.stringify(userObj));
        // Redirect to /dashboard if patient or /clinician if doctor or /analytics if admin
        if (newRole === 'patient') {
            window.location.href = '/today';
        } else if (['doctor', 'care_coordinator'].includes(newRole)) {
            window.location.href = '/clinician';
        } else if (newRole === 'admin') {
            window.location.href = '/analytics';
        } else {
            window.location.reload();
        }
    } catch(e) {
        window.location.reload();
    }
};
</script>
